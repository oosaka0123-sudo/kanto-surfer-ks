<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082331">
  <meta name="description" content="関東サーファー個別ページ用の時間別・週間予報UIプレビュー。">
  <title>個別ページ予報UI｜Kanto Surfer KS</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Kanto Surfer KS">
      <span class="brand-mark">KS</span><span class="brand-copy">Kanto Surf</span>
    </a>
    <button class="menu-button" type="button" aria-label="メニュー" disabled><span></span><span></span><span></span></button>
  </header>

  <main>
    <section class="forecast-section" aria-labelledby="forecast-title">
      <div class="section-title"><span class="section-number">04</span><span class="section-icon" aria-hidden="true">⌁</span><h1 id="forecast-title">時間別予報</h1></div>
      <div class="forecast-shell" data-forecast>
        <div class="forecast-tabs" role="tablist" aria-label="予報期間">
          <button id="tab-hourly" class="forecast-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-forecast" data-mode="hourly">時間別</button>
          <button id="tab-weekly" class="forecast-tab" type="button" role="tab" aria-selected="false" aria-controls="panel-forecast" data-mode="weekly">週間</button>
        </div>
        <div class="forecast-panel" id="panel-forecast" role="tabpanel" aria-labelledby="tab-hourly">
          <div class="forecast-legend" aria-label="グラフ凡例">
            <span><i class="legend-wave"></i>波高(m)</span><span><i class="legend-wind"></i>風(m/s)</span><span class="data-state" data-state>データ未接続</span>
          </div>
          <div class="chart-wrap" aria-label="波高と風速の推移"><svg class="forecast-chart" viewBox="0 0 800 240" preserveAspectRatio="none" data-chart aria-hidden="true"></svg><p class="chart-empty" data-chart-empty>予報データ未接続</p></div>
          <div class="scroll-hint" aria-hidden="true">← 横にスワイプ →</div>
          <div class="forecast-scroll" tabindex="0" aria-label="予報表。左右にスクロールできます" data-scroll><div class="forecast-grid" data-grid></div></div>
        </div>
      </div>
      <p class="forecast-note">公開用に検証・整形されたデータのみ表示します。欠損値は推測せず <code>--</code> と表示します。</p>
    </section>
  </main>
  <footer class="site-footer"><span>KS / KANTO SURFER</span><span>FORECAST UI PREVIEW</span></footer>
</body>
</html>
