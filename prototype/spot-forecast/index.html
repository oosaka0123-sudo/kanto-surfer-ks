<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082331">
  <meta name="description" content="関東サーファー個別ページ用の時間別・10日間予報UIプレビュー。">
  <title>個別ページ予報UI｜Kanto Surfer KS</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Kanto Surfer KS">
      <span class="brand-mark">KS</span><span class="brand-copy">Kanto Surf</span>
    </a>
    <button class="menu-button" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="site-menu"><span></span><span></span><span></span></button>
    <nav class="site-menu" id="site-menu" aria-label="ページメニュー" hidden><a href="#forecast-title">予報</a><a href="#forecast-note">データについて</a></nav>
  </header>

  <main>
    <section class="forecast-section" aria-labelledby="forecast-title">
      <div class="section-title"><span class="section-number">04</span><span class="section-icon" aria-hidden="true">⌁</span><h1 id="forecast-title">時間別予報</h1></div>
      <div class="forecast-shell" data-forecast data-src="../../data/public/kugenuma.json">
        <div class="forecast-panel" id="panel-forecast" aria-labelledby="forecast-title">
          <div class="forecast-legend" aria-label="グラフ凡例">
            <span><i class="legend-wave"></i><span data-wave-label>モデル波高(m)</span></span><span><i class="legend-wind"></i>風(m/s)</span><span class="data-state" data-state>データ未接続</span>
          </div>
          <div class="chart-wrap" aria-label="モデル波高と風速の推移"><svg class="forecast-chart" viewBox="0 0 800 240" preserveAspectRatio="none" data-chart aria-hidden="true"></svg><p class="chart-empty" data-chart-empty>予報データ未接続</p></div>
          <div class="scroll-hint" aria-hidden="true">← 横にスワイプ →</div>
          <div class="forecast-scroll" tabindex="0" aria-label="予報表。左右にスクロールできます" data-scroll><div class="forecast-grid" data-grid></div></div>
          <aside class="verified-observation" data-observation hidden aria-live="polite"></aside>
        </div>
      </div>
      <p class="forecast-note" id="forecast-note" data-forecast-note>Open-Meteoの海洋モデル波高です。実際のブレイクサイズを直接示す値ではありません。</p>
    </section>
    <section class="forecast-section daily-section" id="daily-forecast" aria-labelledby="daily-title" data-daily>
      <div class="section-title"><span class="section-number">05</span><span class="section-icon" aria-hidden="true">⌁</span><h2 id="daily-title">10日間の波・風予報</h2></div>
      <p class="daily-subtitle"><span data-daily-spot>鵠沼</span>｜5:00〜17:00</p>
      <div class="daily-table-wrap">
        <table class="daily-table" aria-label="10日間の波と風の予報">
          <colgroup><col class="c-date"><col class="c-weather"><col class="c-wave"><col class="c-wind"><col class="c-dir"><col class="c-judge"></colgroup>
          <thead><tr><th scope="col">日付</th><th scope="col">天気</th><th scope="col">モデル波高<small>(m)</small></th><th scope="col">風速<small>(m/s)</small></th><th scope="col">風向</th><th scope="col">判定</th></tr></thead>
          <tbody data-daily-body><tr><td colspan="6" class="daily-empty">データ取得中...</td></tr></tbody>
        </table>
      </div>
      <div class="daily-meta"><span data-daily-updated>データ取得中...</span><span>提供：Open-Meteo</span></div>
    </section>
  </main>
  <footer class="site-footer"><span>KS / KANTO SURFER</span><span>FORECAST UI PREVIEW</span></footer>
</body>
</html>
