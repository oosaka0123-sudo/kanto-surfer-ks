# Canonical GitHub Pages workflow for Kanto Surfer. Keep Pages deployment in this file only.
name: Deploy Kanto Surfer

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'prototype/spot-forecast/**'
      - 'scripts/fetch_open_meteo.php'
      - 'scripts/normalize_open_meteo.php'
      - 'scripts/build_public_forecast.php'
      - 'scripts/tide_jma.php'
      - 'tests/tide_jma_smoke.php'
      - 'tests/kugenuma_hourly_smoke.cjs'
      - 'data/tide-jma/**'
      - 'scripts/build_pages_site.php'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/**'
      - 'prototype/spot-forecast/**'
      - 'scripts/fetch_open_meteo.php'
      - 'scripts/normalize_open_meteo.php'
      - 'scripts/build_public_forecast.php'
      - 'scripts/tide_jma.php'
      - 'tests/tide_jma_smoke.php'
      - 'tests/kugenuma_hourly_smoke.cjs'
      - 'data/tide-jma/**'
      - 'scripts/build_pages_site.php'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, openssl
          coverage: none

      - name: Syntax checks
        run: |
          php -l scripts/fetch_open_meteo.php
          php -l scripts/normalize_open_meteo.php
          php -l scripts/build_public_forecast.php
          php -l scripts/tide_jma.php
          php tests/tide_jma_smoke.php
          php -l scripts/build_pages_site.php
          node --check prototype/spot-forecast/app.js

      - name: Fetch 8-day Open-Meteo forecast
        run: php scripts/fetch_open_meteo.php --output-dir="$RUNNER_TEMP/raw"

      - name: Normalize forecast
        run: php scripts/normalize_open_meteo.php --input="$RUNNER_TEMP/raw/latest.json" --output-dir="$RUNNER_TEMP/normalized"

      - name: Build public forecast payloads
        run: php scripts/build_public_forecast.php --input="$RUNNER_TEMP/normalized/latest.json" --output-dir="$RUNNER_TEMP/public" --validation-dir="data/validation"

      - name: Build Pages site
        run: php scripts/build_pages_site.php --public-dir="$RUNNER_TEMP/public" --output-dir="$RUNNER_TEMP/site"

      - name: Verify Pages artifact
        run: |
          test -f "$RUNNER_TEMP/site/index.html"
          jq -e '.spot.id=="kugenuma" and .tide.station_id=="D8" and (.tide.days | length)>=3 and any(.hourly[]; .precipitation_1h_mm != null)' "$RUNNER_TEMP/site/data/kugenuma.json" >/dev/null
          node tests/kugenuma_hourly_smoke.cjs "$RUNNER_TEMP/site/data"
          grep -q 'data-tide-rain-grid' "$RUNNER_TEMP/site/spots/kugenuma/index.html"
          ! grep -q 'data-tide-rain-grid' "$RUNNER_TEMP/site/spots/katakai/index.html"
          jq -e 'all(.hourly[]; has("precipitation_probability_pct"))' "$RUNNER_TEMP/site/data/kugenuma.json" >/dev/null
          test -f "$RUNNER_TEMP/site/app.js"
          test -f "$RUNNER_TEMP/site/styles.css"
          test "$(find "$RUNNER_TEMP/site/data" -maxdepth 1 -name '*.json' | wc -l)" -eq 10
          test "$(find "$RUNNER_TEMP/site/spots" -mindepth 2 -maxdepth 2 -name 'index.html' | wc -l)" -eq 9
          for page in about contact privacy; do
            test -f "$RUNNER_TEMP/site/$page/index.html"
          done
          grep -q 'spots/kugenuma/' "$RUNNER_TEMP/site/index.html"
          grep -q 'index,follow' "$RUNNER_TEMP/site/index.html"
          grep -q '<link rel="canonical" href="https://kanto.rss7.net/' "$RUNNER_TEMP/site/index.html"
          while IFS= read -r page; do
            grep -q 'index,follow' "$page"
            grep -q '<link rel="canonical" href="https://kanto.rss7.net/' "$page"
          done < <(find "$RUNNER_TEMP/site/spots" -mindepth 2 -maxdepth 2 -name 'index.html')
          for page in about contact privacy; do
            grep -q 'index,follow' "$RUNNER_TEMP/site/$page/index.html"
            grep -q '<link rel="canonical" href="https://kanto.rss7.net/' "$RUNNER_TEMP/site/$page/index.html"
          done
          test -f "$RUNNER_TEMP/site/sitemap.xml"
          test -f "$RUNNER_TEMP/site/robots.txt"
          test -f "$RUNNER_TEMP/site/CNAME"
          grep -q '<loc>https://kanto.rss7.net/</loc>' "$RUNNER_TEMP/site/sitemap.xml"
          grep -q 'Sitemap: https://kanto.rss7.net/sitemap.xml' "$RUNNER_TEMP/site/robots.txt"
          grep -qx 'kanto.rss7.net' "$RUNNER_TEMP/site/CNAME"
          ! grep -R -q 'noindex,nofollow' "$RUNNER_TEMP/site" --include='*.html'
          ! grep -R -E 'password|api[_-]?key|Authorization: Bearer' "$RUNNER_TEMP/site" --exclude='*.json'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
